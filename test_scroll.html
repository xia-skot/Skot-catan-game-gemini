<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; overflow: hidden; background: #ccc; }
  #container {
    position: absolute;
    top: 0; left: 100vw;
    width: 100vh; height: 100vw;
    transform: rotate(90deg);
    transform-origin: top left;
    background: white;
    overflow-y: auto;
  }
  .item { height: 100px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
  <div id="container">
    <div style="height: 2000px;">
       <div class="item">Item 1</div>
       <div class="item">Item 2</div>
       <div class="item">Item 3</div>
    </div>
  </div>
  <script>
    // Add custom scroll logic
    const container = document.getElementById('container');
    let startX = 0;
    let startY = 0;
    let scrollTopStart = 0;
    container.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        scrollTopStart = container.scrollTop;
    }, {passive: true});
    container.addEventListener('touchmove', (e) => {
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        // if rotated 90deg, swipe up (dx > 0) means scroll down (scrollTop increases)
        // Wait, dx = current - start. If user swipes up (to physical right edge), dx > 0.
        container.scrollTop = scrollTopStart + dx;
    }, {passive: false});
  </script>
</body>
</html>
