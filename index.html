<!doctype html>
<html lang="zh-CN" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="google" content="notranslate" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="卡坦岛" />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="apple-touch-icon" href="/icons/catan-original-v6-192.png" />
    <title>卡坦岛 - Catan Online</title>
  </head>
  <body class="notranslate bg-slate-50" translate="no">
    <div id="root">
      <div style="position: absolute; inset: 0; overflow: hidden; background-color: #e1f0fa; color: white; font-family: sans-serif;">
        <svg id="boot-sea" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true"></svg>
        <div role="status" class="boot-caption">资源加载中<span class="boot-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
          <div class="boot-meter"><div></div></div>
          <small>正在加载游戏程序</small>
        </div>
      </div>
      <style>
        .boot-caption { position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 32px);left:8%;width:84%;text-align:center;font-size:14px;font-weight:600; }
        .boot-caption small { display:block;margin-top:12px;font-size:12px;font-weight:400; }
        .boot-meter { height:18px;border-radius:8px;background:#286c98;overflow:hidden;margin:12px auto 0;max-width:640px; }
        .boot-meter>div { height:100%;width:30%;background:#56c4f9;animation:boot-meter 1.4s ease-in-out infinite; }
        @keyframes boot-meter { from { transform:translateX(-100%); } to { transform:translateX(340%); } }
        .boot-dots span { animation: boot-dot 1.2s infinite; }
        .boot-dots span:nth-child(2) { animation-delay: .2s; }
        .boot-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes boot-dot { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
      </style>
      <script>
        // Match SailingScene's geometry before the application bundle is available.
        {
          const w = innerWidth, h = innerHeight, portrait = w < h;
          const wavelength = portrait ? w / 2 : w / 3.5;
          const amplitude = Math.min(wavelength * (portrait ? .05 : .03), h * (portrait ? .02 : .03));
          const y = x => Math.sin(x / wavelength * Math.PI * 2) * amplitude + h * .45;
          let line = `M0 ${y(0)}`;
          for (let x = 10; x < w; x += 10) line += ` L${x} ${y(x)}`;
          line += ` L${w} ${y(w)}`;
          const svg = document.getElementById('boot-sea');
          svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
          svg.innerHTML = `<path d="${line}" stroke="#1e6b9c" stroke-width="12" opacity=".4" fill="none" style="filter:blur(5px)"/><path d="${line} L${w} ${h} L0 ${h} Z" fill="#27a6e6"/><path d="${line}" stroke="#85caec" stroke-width="4" fill="none"/>`;
        }
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
